{{- if .Values.dbPasswordSync.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-db-password-sync
  labels: {{- include "common.labels.standard" (dict "customLabels" .Values.commonLabels "context" $) | nindent 4 }}
    app.kubernetes.io/component: db-password-sync
  annotations:
    # Commons Postgres is persistent, so the SPAR DB role survives uninstall/reinstall.
    # postgres-init only CREATEs a missing role — it never updates an existing role's
    # password. After a Secret regen or version reset the role password drifts from the
    # Secret and the app's startup `migrate` fails to authenticate. This hook re-syncs the
    # role password to its Secret BEFORE the app pods start, so migrate authenticates.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 3
  template:
    metadata:
      labels: {{- include "common.labels.standard" (dict "customLabels" .Values.commonLabels "context" $) | nindent 8 }}
        app.kubernetes.io/component: db-password-sync
    spec:
      restartPolicy: Never
      containers:
        - name: sync
          image: "{{ .Values.dbPasswordSync.image.repository }}:{{ .Values.dbPasswordSync.image.tag }}"
          imagePullPolicy: {{ .Values.dbPasswordSync.image.pullPolicy }}
          env:
            - name: PGHOST
              value: {{ tpl .Values.global.postgresqlHost $ | quote }}
            - name: PGSUPERPASS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.dbPasswordSync.superuserSecret | quote }}
                  key: {{ .Values.dbPasswordSync.superuserPasswordKey | quote }}
            - name: SPAR_USER
              value: {{ tpl .Values.global.sparDBUser $ | quote }}
            - name: SPAR_PW
              valueFrom:
                secretKeyRef:
                  name: {{ tpl .Values.global.sparDBSecret $ | quote }}
                  key: {{ tpl .Values.global.sparDBUserPasswordKey $ | quote }}
                  optional: true
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              export PGPASSWORD="$PGSUPERPASS"
              # Only ALTER a role that already exists; on a fresh install the role may
              # not be created yet (postgres-init makes it with the same Secret), so a
              # missing role/Secret is a no-op here. format(%I,%L) safely quotes both.
              if [ -z "${SPAR_PW:-}" ]; then
                echo "no secret password for role '$SPAR_USER' yet; skipping"
              else
                echo "Syncing password for role '$SPAR_USER' ..."
                psql -h "$PGHOST" -U postgres -d postgres -v ON_ERROR_STOP=1 \
                  -c "DO \$do\$ BEGIN IF EXISTS (SELECT FROM pg_roles WHERE rolname='$SPAR_USER') THEN EXECUTE format('ALTER USER %I WITH PASSWORD %L', '$SPAR_USER', '$SPAR_PW'); END IF; END \$do\$;"
              fi
              echo "DB role password sync complete."
{{- end }}
