{{- $values := index .Values "sparMapperAPI" -}}
{{- $global := .Values.global -}}
{{- if $values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "mapper.serviceAccountName" . }}
  labels:
    {{- include "mapper.labels" . | nindent 4 }}
  {{- with $values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
