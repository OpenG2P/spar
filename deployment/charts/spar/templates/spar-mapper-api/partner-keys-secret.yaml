{{- if .Values.global.testPartnerEnabled }}
# TEST/DEMO ONLY. Onboards the committed TEST-ONLY G2P Bridge public key as
# PARTNER_G2P_BRIDGE so a trial Bridge — signing its resolve requests with the
# matching private key — is verified out of the box. Gated by
# global.testPartnerEnabled; never rendered for a production install. This becomes
# SPAR's partner-keys Secret (the same name the mapper API mounts at
# global.sparPartnerKeysDir).
apiVersion: v1
kind: Secret
metadata:
  name: {{ tpl .Values.global.sparPartnerKeysSecret $ }}
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: test-partner
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: Opaque
stringData:
  {{- range .Values.testPartner.mnemonics }}
  PARTNER_{{ . }}.json: {{ printf "{\"keys\":[%s]}" $.Values.testPartner.publicJwk | quote }}
  {{- end }}
{{- end }}
