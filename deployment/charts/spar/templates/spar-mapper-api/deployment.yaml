{{- $values := index .Values "sparMapperAPI" -}}
{{- $global := .Values.global -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "common.names.fullname" $ }}-mapper-api
  labels:
    {{- include "mapper.labels" . | nindent 4 }}
spec:
  {{- if not $values.autoscaling.enabled }}
  replicas: {{ $values.replicaCount }}
  {{- end }}
  {{- with $values.updateStrategy }}
  strategy: {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "mapper.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- if $values.podAnnotations }}
      annotations: {{- include "mapper.tpl" (dict "value" $values.podAnnotations "context" $) | nindent 8 }}
      {{- end }}
      labels:
        {{- include "mapper.selectorLabels" . | nindent 8 }}
    spec:
      {{- with $values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "mapper.serviceAccountName" . }}
      {{- with $values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        {{- if $values.postgresCheckerInit.enabled }}
        - name: postgres-checker
          image: {{ $values.postgresCheckerInit.image }}
          command:
            {{- toYaml $values.postgresCheckerInit.command | nindent 12 }}
          env: {{- include "mapper.envVars" . | nindent 12 }}
        {{- end }}
      containers:
        - name: "spar-mapper-api"
          {{- with $values.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ $values.image.repository }}:{{ $values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ $values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ $values.containerPort }}
              protocol: TCP
          env: {{- include "mapper.envVars" . | nindent 12 }}
          {{- with $values.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $values.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          # Partner public keys for inbound signature verification (read-only),
          # mounted from a Secret. optional:true lets the API start when the mount
          # is absent (validation off / partners not yet onboarded).
          volumeMounts:
            - name: partner-keys
              mountPath: {{ $global.sparPartnerKeysDir | quote }}
              readOnly: true
      volumes:
        - name: partner-keys
          secret:
            secretName: {{ tpl $global.sparPartnerKeysSecret $ }}
            optional: true
