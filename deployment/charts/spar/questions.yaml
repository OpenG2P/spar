questions:
# ----------------------------- Hostnames -----------------------------
- variable: sparMapperAPI.sparHostname
  description: Hostname for the SPAR Mapper API
  type: string
  label: SPAR Mapper API Hostname
  group: Hostnames

- variable: benePortalAPI.benePortalHostname
  description: Hostname for the SPAR Beneficiary Portal API
  type: string
  label: Beneficiary Portal Hostname
  group: Hostnames

# ----------------------------- Keycloak ------------------------------
- variable: keycloak-init.enabled
  description: Provision the SPAR OIDC client in Keycloak via the keycloak-init job
  type: boolean
  default: true
  label: Enable Keycloak Init
  group: Keycloak

- variable: global.keycloakBaseUrl
  description: Public (namespace-scoped) Keycloak base URL used by apps for the OIDC issuer/token URL
  type: string
  label: Keycloak Base URL
  group: Keycloak

- variable: global.keycloakRealm
  description: Keycloak realm in which the SPAR client is provisioned and tokens are issued
  type: string
  label: Keycloak Realm
  group: Keycloak

- variable: global.keycloakBeneficiaryRealm
  description: Dedicated Keycloak realm for Beneficiary Portal users (separate from staff/agent)
  type: string
  default: beneficiary
  label: Beneficiary Realm
  group: Keycloak
- variable: global.benePortalAuthClientId
  description: Public OIDC client ID for the Beneficiary Portal (created in the beneficiary realm)
  type: string
  default: spar-bene-portal
  label: Beneficiary Portal Client ID
  group: Keycloak

- variable: global.authClientId
  description: OIDC client ID (must match the client provisioned by keycloak-init)
  type: string
  label: OIDC Client ID
  group: Keycloak

- variable: global.authClientSecret
  description: Kubernetes secret name holding the OIDC client password
  type: string
  label: OIDC Client Secret Name
  group: Keycloak

- variable: global.authClientSecretKey
  description: Key within the secret containing the OIDC client password
  type: string
  label: OIDC Client Secret Key
  group: Keycloak

# --------------------------- Authentication --------------------------
# Inbound partner signature verification is done locally (no Keymanager). Turn it
# on only after onboarding partner public keys into the Secret below.
- variable: global.sparSignatureValidationEnabled
  description: Verify a partner JWS signature on every Mapper Partner API request (partners must be onboarded first)
  type: boolean
  default: false
  label: Verify Partner Signatures
  group: Authentication
- variable: global.sparPartnerKeysSecret
  description: Secret holding partner public keys — one JWKS file per partner, named PARTNER_<MNEMONIC>.json
  type: string
  label: Partner Public Keys Secret
  group: Authentication
- variable: global.sparSignatureAllowedAlgorithms
  description: Comma-separated allowed JWS algorithms (RS256 only; none/HMAC always rejected)
  type: string
  label: Allowed Signature Algorithms
  group: Authentication

# ----------------------------- Database ------------------------------
- variable: global.postgresqlHost
  description: |-
    PostgreSQL host for the SPAR database. Defaults to the in-cluster
    commons-postgresql. If you want to connect to an external database, provide
    the external database IP/hostname here.
  type: string
  label: PostgreSQL Host
  group: Database
- variable: global.sparDB
  description: SPAR database name (defaults to the release name, underscored)
  type: string
  label: SPAR Database
  group: Database
- variable: global.sparDBUser
  description: SPAR database user (defaults to <release>_user, underscored)
  type: string
  label: SPAR Database User
  group: Database
- variable: global.sparDBSecret
  description: Kubernetes secret holding the SPAR database user password
  type: string
  label: SPAR Database User Secret
  group: Database
- variable: global.sparDBUserPasswordKey
  description: Key within the secret containing the SPAR database user password
  type: string
  label: SPAR Database User Password Key
  group: Database
