apiVersion: v2
name: openg2p-spar
description: A Helm chart for OpenG2P SPAR - June 2026 Edition
type: application
# Version handling:
#   This `version` is a STATIC placeholder — NOT the published version. The
#   helm-publish workflow derives the real version from the BRANCH NAME and
#   overrides this at package time via `helm package --version`:
#       develop  -> 0.0.0-develop.<run-number>
#       N.N      -> N.N.0-develop.<run-number>   (Helm needs a 3-part SemVer)
#       N.N.N    -> N.N.N                          (frozen release, no suffix)
#   Bumping the value below has no effect on CI-published charts; it is used only
#   by a local `helm package` / `helm install .` that does not pass --version.
version: 0.0.0-g2p5209
dependencies:
- name: common
  repository: https://openg2p.github.io/openg2p-helm
  version: 2.30.0
- name: postgres-init
  version: 1.2.0
  repository: https://openg2p.github.io/openg2p-helm
  condition: postgres-init.enabled
- name: keycloak-init
  version: 1.1.1
  repository: https://openg2p.github.io/openg2p-helm
  condition: keycloak-init.enabled
icon: https://openg2p.github.io/openg2p-helm/openg2p-logo.png
annotations:
  catalog.cattle.io/display-name: "OpenG2P SPAR"
  openg2p.org/add-to-rancher: ""
