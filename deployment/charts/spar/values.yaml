global:
  postgresqlHost: commons-postgresql
  sparDB: '{{ printf "%s" .Release.Name | replace "-" "_" }}'
  sparDBUser: '{{ printf "%s_user" .Release.Name | replace "-" "_" }}'
  sparDBSecret: '{{ .Release.Name }}'
  sparDBUserPasswordKey: '{{ .Release.Name }}-db-user'

  # Security & Authentication
  # Public (namespace-scoped) Keycloak hostname used by apps for the OIDC
  # issuer/token URL. The keycloak-init Job below talks to the same Keycloak
  # over its internal cluster URL.
  keycloakBaseUrl: 'https://keycloak.{{ .Release.Namespace }}.openg2p.org'
  keycloakRealm: 'staff'
  keycloakIssuerUrl: '{{ tpl .Values.global.keycloakBaseUrl $ }}/realms/{{ tpl .Values.global.keycloakRealm $ }}'
  # OIDC client ID — must match the clientId provisioned in keycloak-init.realms
  authClientId: 'openg2p-spar'
  # K8s Secret name holding the client password (created by keycloak-init).
  # By convention the Secret is named after the client ID.
  authClientSecret: '{{ tpl .Values.global.authClientId $ }}'
  # Key inside the secret containing the client password
  authClientSecretKey: 'client_secret'

  # Beneficiary Portal authenticates BENEFICIARIES against a SEPARATE Keycloak
  # realm — NOT the staff/agent realm — because beneficiaries are a distinct user
  # population from staff/agents. keycloak-init below creates this realm and the
  # portal's public OIDC client.
  keycloakBeneficiaryRealm: 'beneficiary'
  keycloakBeneficiaryIssuerUrl: '{{ tpl .Values.global.keycloakBaseUrl $ }}/realms/{{ tpl .Values.global.keycloakBeneficiaryRealm $ }}'
  # Public hostname of the Beneficiary Portal (the OIDC redirect-URI host).
  benePortalHostname: 'beneficiary.{{ .Release.Namespace }}.openg2p.org'
  # Public (SPA / browser-login) OIDC client for the Beneficiary Portal, created
  # in the beneficiary realm.
  benePortalAuthClientId: 'spar-bene-portal'

  # Inbound partner JWS signature verification (local, Keymanager-free). When
  # true, every Mapper Partner API request must carry a valid detached JWS in the
  # "Signature" header, verified in-process against the partner's public key.
  # Partner keys are mounted from a Secret (one JWKS file per partner, named
  # PARTNER_<MNEMONIC>.json). The G2P Bridge calls SPAR as
  # sender_app_mnemonic=g2p_bridge -> PARTNER_G2P_BRIDGE.
  sparSignatureValidationEnabled: false
  sparPartnerKeysDir: /etc/spar/partner-keys
  sparPartnerKeysSecret: '{{ .Release.Name }}-partner-keys'
  # RS256 only (asymmetric); "none" and HMAC (HS*) are always rejected.
  sparSignatureAllowedAlgorithms: "RS256"

  # TEST/DEMO trial profile. When true (the default for the bundled trial
  # install), the chart onboards the well-known TEST-ONLY G2P Bridge key (see the
  # testPartner block below) AND turns signature validation ON, so a trial G2P
  # Bridge signing its resolve requests is verified out of the box. The test key
  # is committed in the bridge repo, so set this false for any real deployment.
  testPartnerEnabled: true

# TEST/DEMO ONLY — gated by global.testPartnerEnabled. Onboards the well-known
# TEST-ONLY G2P Bridge public key (mirrors the bridge repo's test/keys) as
# PARTNER_G2P_BRIDGE, so a trial G2P Bridge — signing its resolve requests with the
# matching private key — is verified out of the box. The private key is public
# knowledge (committed in the bridge repo), so NEVER enable in production: set
# global.testPartnerEnabled=false and onboard real partner public keys.
testPartner:
  # The G2P Bridge calls SPAR with sender_app_mnemonic "g2p_bridge" -> PARTNER_G2P_BRIDGE.
  mnemonics:
    - G2P_BRIDGE
  publicJwk: '{"n":"x58O6HUXdeDradiCZpE8ZRGH8VYsRAHfdur6HRd5-HEyGXSltRHuJyWmm67W7psIExrTURFTAbE86EO1pZqefOElsbW_B008n4H5OCoxajXiLaxftvJKQuB7D9UrACkLazMJAJbWK1nfMhYAoya_JyYZ3CAk9TsRC35hcUmoqWd5zl1cwcss2CQzehF4FqicLqfoTibldLpMkpsLcnJywJux77uIhcvDE-S1CAvl8WEfORoXw_5D5zXDdL_Kbcv_czj_683pa4-fTAnwFk8k-JIpv4GDZnNresC3iTPr_QEzZ8ilJMrWeJtJUBvv1_JUwbTLLKVzsBta1r5pdfzk_Q","e":"AQAB","kid":"test-partner-2026","alg":"RS256","use":"sig","kty":"RSA"}'

postgres-init:
  enabled: true
  postgresql:
    host: '{{ .Values.global.postgresqlHost }}'
    port: 5432
    # Hard coding. Same as one defined under Odoo
    existingSecret: commons-postgresql
    existingSecretPostgresPasswordKey: postgres-password
  databases:
    # Same as db in Odoo
    - name: '{{ tpl .Values.global.sparDB $ }}'
      user: '{{ tpl .Values.global.sparDBUser $ }}'
      secret: '{{ tpl .Values.global.sparDBSecret $ }}'
      secretUserPasswordKey: '{{ tpl .Values.global.sparDBUserPasswordKey $ }}'

# Provisions the SPAR OIDC client in Keycloak. The Job is idempotent: it
# creates the realm if absent and adds the client, leaving anything that
# already exists untouched. For each confidential client it also creates a
# K8s Secret named after the clientId (key: client_secret) with an
# auto-generated password — this is the Secret the mapper API consumes via
# global.authClientSecret / global.authClientSecretKey above.
# NOTE: realm/clientId reference the global.* values (the only values visible
# to a subchart) so they are defined once and never duplicated here.
keycloak-init:
  enabled: true
  keycloak:
    # Internal cluster URL of the Keycloak installed in this namespace.
    url: 'http://commons-keycloak:80'
    user: 'admin'
    password: ''
    # The Keycloak chart's auto-created admin secret (<commons-release>-keycloak).
    existingSecret: 'commons-keycloak'
    existingSecretKey: 'admin-password'
  realms:
    # Staff realm (shared, commons layer) — holds the mapper API's service client.
    '{{ tpl .Values.global.keycloakRealm $ }}':
      clients:
        - clientId: '{{ tpl .Values.global.authClientId $ }}'
          name: OpenG2P SPAR
          # Confidential service-to-service client (OAuth2 client_credentials):
          # the mapper API exchanges client id + secret for a token. It has no
          # browser login flow, so no redirect URIs / web origins are needed.
          redirectUris: []
          webOrigins: []
    # Dedicated BENEFICIARY realm — a separate user population from staff/agents.
    # keycloak-init creates the realm if absent and adds the portal's public
    # (browser-login) OIDC client.
    '{{ tpl .Values.global.keycloakBeneficiaryRealm $ }}':
      clients:
        - clientId: '{{ tpl .Values.global.benePortalAuthClientId $ }}'
          name: SPAR Beneficiary Portal
          # Public SPA client (Authorization Code + PKCE in the browser) — not a
          # confidential client, so no client secret.
          publicClient: true
          # Host-scoped redirect URIs — restricted to the Beneficiary Portal's
          # public hostname (root, OIDC callback, post-login). Never a bare "*".
          redirectUris:
            - 'https://{{ tpl .Values.global.benePortalHostname $ }}/*'
          webOrigins:
            - 'https://{{ tpl .Values.global.benePortalHostname $ }}'

# Seeds shared SPAR reference data (the `strategy` table) at install/upgrade via
# a post-install/post-upgrade Job. Seeding is ADDITIVE and IDEMPOTENT: each row
# is inserted by its pinned `id` with `ON CONFLICT (id) DO NOTHING`, so existing
# rows are never modified or deleted. To add a strategy later, append a new entry
# with a new `id` and run `helm upgrade` — nothing else changes.
#
# A Strategy defines how a Financial Address (FA) — or an ID — is serialized and
# parsed:
#   construct_strategy   : a Python format string, e.g. "{bank_code}-{acc}"
#   deconstruct_strategy : a regex with named groups, e.g. "(?P<bank_code>.*)-(?P<acc>.*)"
# The keys must match the FA/ID field names. The link/update API references a
# strategy by its integer `id` (fa.strategy_id), so ids must stay stable.
seedData:
  enabled: true
  # Image providing psql / pg_isready for the seed Job.
  image: jbergknoff/postgresql-client
  strategies:
    - id: 1
      description: Key Cloak
      strategy_type: ID
      construct_strategy: 'token:{sub}@nationalId'
      deconstruct_strategy: '^token:(?P<sub>.[^.]*)@nationalId$'
    - id: 2
      description: Bank
      strategy_type: FA
      construct_strategy: 'account_number:{account_number}.branch_name:{branch_name}.branch_code:{branch_code}.bank_name:{bank_name}.bank_code:{bank_code}.fa_type:{fa_type}'
      deconstruct_strategy: '^account_number:(?P<account_number>.*)\.branch_name:(?P<branch_name>.*)\.branch_code:(?P<branch_code>.*)\.bank_name:(?P<bank_name>.*)\.bank_code:(?P<bank_code>.*)\.fa_type:(?P<fa_type>.*)$'
    - id: 3
      description: Email
      strategy_type: FA
      construct_strategy: 'email_address:{email_address}.wallet_provider_name:{wallet_provider_name}.wallet_provider_code:{wallet_provider_code}.fa_type:{fa_type}'
      deconstruct_strategy: '^email_address:(?P<email_address>.*)\.wallet_provider_name:(?P<wallet_provider_name>.*)\.wallet_provider_code:(?P<wallet_provider_code>.*)\.fa_type:(?P<fa_type>.*)$'
    - id: 4
      description: Phone
      strategy_type: FA
      construct_strategy: 'mobile_number:{mobile_number}.wallet_provider_name:{wallet_provider_name}.wallet_provider_code:{wallet_provider_code}.fa_type:{fa_type}'
      deconstruct_strategy: '^mobile_number:(?P<mobile_number>.*)\.wallet_provider_name:(?P<wallet_provider_name>.*)\.wallet_provider_code:(?P<wallet_provider_code>.*)\.fa_type:(?P<fa_type>.*)$'
    # Bank FA serialized in the exact shape the G2P Bridge expects
    # (G2P_BRIDGE_CELERY_WORKERS_BANK_FA_DECONSTRUCT_STRATEGY):
    #   account_number:<a>.branch_code:<b>.bank_code:<c>.mobile_number:.email_address:.fa_type:BANK_ACCOUNT
    # mobile_number / email_address are emitted empty (a bank FA has neither), and
    # fa_type is hardcoded to BANK_ACCOUNT because the Bridge/Example-Bank route on
    # the literal "BANK_ACCOUNT" (SPAR's FA provider enum is "BANK").
    - id: 5
      description: Bank (G2P Bridge)
      strategy_type: FA
      construct_strategy: 'account_number:{account_number}.branch_code:{branch_code}.bank_code:{bank_code}.mobile_number:.email_address:.fa_type:BANK_ACCOUNT'
      deconstruct_strategy: '^account_number:(?P<account_number>.*)\.branch_code:(?P<branch_code>.*)\.bank_code:(?P<bank_code>.*)\.mobile_number:(?P<mobile_number>.*)\.email_address:(?P<email_address>.*)\.fa_type:(?P<fa_type>.*)$'

sparMapperAPI:
  enabled: true
  sparHostname: spar.trial.openg2p.org
  postgresql:
    enabled: false
  replicaCount: 1
  image:
    repository: openg2p/openg2p-spar-mapper-partner-api
    pullPolicy: Always
    tag: "develop"
  imagePullSecrets: []
  nameOverride: ""
  fullnameOverride: ""
  envVars:
    SPAR_MAPPER_PARTNER_API_DB_HOSTNAME: '{{ .Values.global.postgresqlHost }}'
    # Inbound partner JWS signature verification (local, Keymanager-free). On when
    # explicitly enabled OR when the trial test partner (G2P Bridge) is onboarded.
    SPAR_MAPPER_PARTNER_API_JWT_AUTH_ENABLED: '{{ or .Values.global.sparSignatureValidationEnabled .Values.global.testPartnerEnabled }}'
    SPAR_MAPPER_PARTNER_API_PARTNER_KEYS_DIR: '{{ .Values.global.sparPartnerKeysDir }}'
    SPAR_MAPPER_PARTNER_API_SIGNATURE_ALLOWED_ALGORITHMS: '{{ .Values.global.sparSignatureAllowedAlgorithms }}'
    SPAR_MAPPER_PARTNER_API_DB_DBNAME: '{{ tpl .Values.global.sparDB $ }}'
    SPAR_MAPPER_PARTNER_API_DB_USERNAME: '{{ tpl .Values.global.sparDBUser $ }}'
    SPAR_MAPPER_PARTNER_API_OPENAPI_ROOT_PATH: "/api/mapper"
  envVarsFrom:
    SPAR_MAPPER_PARTNER_API_DB_PASSWORD:
      secretKeyRef:
        name: '{{ tpl .Values.global.sparDBSecret $ }}'
        key:  '{{ tpl .Values.global.sparDBUserPasswordKey $ }}'

  containerPort: 8000
  service:
    type: ClusterIP
    port: 80
  resources: {}
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 1
    targetCPUUtilizationPercentage: 80
  readinessProbe:
    httpGet:
      path: /ping
      port: 8000
    failureThreshold: 20
    periodSeconds: 30
    timeoutSeconds: 10
    initialDelaySeconds: 30
  livenessProbe:
    httpGet:
      path: /ping
      port: 8000
    initialDelaySeconds: 15
    periodSeconds: 60
    failureThreshold: 5
  startupProbe:
    enabled: true
    httpGet:
      path: /ping
      port: 8000
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30
    successThreshold: 1
  serviceAccount:
    create: false
    annotations: {}
    name: ""
  podAnnotations:
    helm.sh/revision: '{{ .Release.Revision }}'
  podSecurityContext: {}
  containerSecurityContext: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  updateStrategy:
    type: RollingUpdate
  command: []
  args: []
  postgresCheckerInit:
    enabled: true
    image: jbergknoff/postgresql-client
    command:
    - 'sh'
    - '-c'
    - 'until pg_isready -U ${SPAR_MAPPER_PARTNER_API_DB_USERNAME} -h ${SPAR_MAPPER_PARTNER_API_DB_HOSTNAME} -p ${SPAR_MAPPER_PARTNER_API_DB_PORT:-5432} -d ${SPAR_MAPPER_PARTNER_API_DB_DBNAME:-spar_db}; do sleep 3; done'
  ingress:
    enabled: false
    className: ""
    annotations:
      nginx.ingress.kubernetes.io/rewrite-target: /$2
      kubernetes.io/ingress.class: nginx
    hosts:
      - host: ""
        paths:
          - path: /api/mapper(/|$)(.*)
            pathType: ImplementationSpecific
    tls: []
  istio:
    enabled: true
    virtualservice:
      enabled: true
      host: ""
      gateway: "internal"
      destination: '{{ include "common.names.fullname" $ }}-mapper-api'
      destinationPort: '{{ .Values.service.port }}'
      prefix: /api/mapper/
      rewriteUri: "/"
    gateway:
      enabled: false
      host: ""
      ingressController:
        istio: ingressgateway
      httpTlsRedirect: true
      httpEnabled: true
      httpsEnabled: false
      tls:
        mode: SIMPLE
        credentialName: ""

benePortalAPI:
  enabled: true
  benePortalHostname: '{{ tpl .Values.global.benePortalHostname $ }}'
  replicaCount: 1
  image:
    repository: openg2p/openg2p-spar-bene-portal-api
    pullPolicy: Always
    tag: "develop"
  imagePullSecrets: []
  nameOverride: ""
  fullnameOverride: ""
  envVars:
    G2P_SPAR_BENE_PORTAL_API_DB_HOSTNAME: '{{ .Values.global.postgresqlHost }}'
    G2P_SPAR_BENE_PORTAL_API_DB_PORT: '5432'
    G2P_SPAR_BENE_PORTAL_API_DB_DBNAME: '{{ tpl .Values.global.sparDB $ }}'
    G2P_SPAR_BENE_PORTAL_API_DB_USERNAME: '{{ tpl .Values.global.sparDBUser $ }}'
    # Beneficiary authentication — validate access tokens issued by the dedicated
    # BENEFICIARY realm (not staff/agent). Issuer + JWKS point at that realm; the
    # accepted audience is the beneficiary-portal OIDC client.
    G2P_SPAR_BENE_PORTAL_API_AUTH_ENABLED: 'true'
    G2P_SPAR_BENE_PORTAL_API_AUTH_DEFAULT_ISSUERS: '["{{ tpl .Values.global.keycloakBeneficiaryIssuerUrl $ }}"]'
    G2P_SPAR_BENE_PORTAL_API_AUTH_DEFAULT_JWKS_URLS: '["{{ tpl .Values.global.keycloakBeneficiaryIssuerUrl $ }}/protocol/openid-connect/certs"]'
    G2P_SPAR_BENE_PORTAL_API_AUTH_DEFAULT_AUDIENCES: '["{{ tpl .Values.global.benePortalAuthClientId $ }}"]'
  envVarsFrom:
    G2P_SPAR_BENE_PORTAL_API_DB_PASSWORD:
      secretKeyRef:
        name: '{{ tpl .Values.global.sparDBSecret $ }}'
        key: '{{ tpl .Values.global.sparDBUserPasswordKey $ }}'
  containerPort: 8000
  service:
    type: ClusterIP
    port: 80
  resources: {}
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 1
    targetCPUUtilizationPercentage: 80
  readinessProbe:
    httpGet:
      path: /ping
      port: 8000
    failureThreshold: 20
    periodSeconds: 30
    timeoutSeconds: 10
    initialDelaySeconds: 30
  livenessProbe:
    httpGet:
      path: /ping
      port: 8000
    initialDelaySeconds: 15
    periodSeconds: 60
    failureThreshold: 5
  startupProbe:
    enabled: true
    httpGet:
      path: /ping
      port: 8000
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30
    successThreshold: 1
  serviceAccount:
    create: false
    annotations: {}
    name: ""
  podAnnotations:
    helm.sh/revision: '{{ .Release.Revision }}'
  podSecurityContext: {}
  containerSecurityContext: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  updateStrategy:
    type: RollingUpdate
  command: []
  args: []
  postgresCheckerInit:
    enabled: true
    image: jbergknoff/postgresql-client
    command:
    - 'sh'
    - '-c'
    - 'until pg_isready -U ${G2P_SPAR_BENE_PORTAL_API_DB_USERNAME} -h ${G2P_SPAR_BENE_PORTAL_API_DB_HOSTNAME} -p ${G2P_SPAR_BENE_PORTAL_API_DB_PORT:-5432} -d ${G2P_SPAR_BENE_PORTAL_API_DB_DBNAME:-spardb}; do sleep 3; done'
  ingress:
    enabled: false
    className: ""
    annotations:
      nginx.ingress.kubernetes.io/rewrite-target: /$2
      kubernetes.io/ingress.class: nginx
    hosts:
      - host: ""
        paths:
          - path: /api/bene-portal(/|$)(.*)
            pathType: ImplementationSpecific
    tls: []
  istio:
    enabled: true
    virtualservice:
      enabled: true
      host: ""
      gateway: "internal"
      destination: '{{ include "common.names.fullname" $ }}-bene-portal-api'
      destinationPort: '{{ .Values.service.port }}'
      prefix: /api/bene-portal/
      rewriteUri: "/"
    gateway:
      enabled: false
      host: ""
      ingressController:
        istio: ingressgateway
      httpTlsRedirect: true
      httpEnabled: true
      httpsEnabled: false
      tls:
        mode: SIMPLE
        credentialName: ""
