name: Build & Publish

# Replaces docker-build-*.yml + helm-publish.yml.
#
# One workflow, not several: a backend-only change must republish the chart, or
# the newest chart keeps pointing at the previous image. The old set had disjoint
# path filters, so that desync was routine.
#
# This file declares only what THIS repo contains. All versioning policy lives
# in openg2p-packaging behind @v1 -- see that repo's ci/README.md.

on:
  push:
    branches: ["**"]
    tags: ["**"]
  # These inputs are for two occasional changelog fixes only. For a normal run,
  # leave the checkbox OFF and the text box EMPTY (it rebuilds/publishes the
  # selected branch as usual).
  workflow_dispatch:
    inputs:
      changelog_skip_ai:
        description: 'Skip the AI summary — publish the changelog from commit messages only (use when AI is unavailable). Leave OFF for a normal run.'
        type: boolean
        default: false
      changelog_regenerate:
        description: 'Backfill the AI summary for a release that published without one: enter its frozen version e.g. 1.0.1 (not a develop version). Leave EMPTY for a normal run.'
        type: string
        default: ''

jobs:
  build-publish:
    uses: openg2p/openg2p-packaging/.github/workflows/build-publish.yml@v1
    with:
      changelog_skip_ai: ${{ inputs.changelog_skip_ai || false }}
      changelog_regenerate: ${{ inputs.changelog_regenerate || '' }}
      # `pins` are per-image: they resolve a git-ref build-arg to a SHA so two
      # builds of the same commit produce identical images. Both SPAR APIs build
      # against fastapi-common `develop` (a BRANCH), so both pin it. SPAR only
      # verifies partner signatures (no signing key) and bundles no simulator, so
      # this repo has two images.
      images: |
        [
          {"name": "mapper-partner-api",
           "repo": "openg2p/openg2p-spar-mapper-partner-api",
           "dockerfile": "docker/spar-apis/mapper-partner-api/Dockerfile",
           "pins": [
             {"arg": "FASTAPI_COMMON_REF",
              "repo": "https://github.com/openg2p/openg2p-fastapi-common",
              "ref": "develop"}
           ]},

          {"name": "bene-portal-api",
           "repo": "openg2p/openg2p-spar-bene-portal-api",
           "dockerfile": "docker/spar-apis/bene-portal-api/Dockerfile",
           "pins": [
             {"arg": "FASTAPI_COMMON_REF",
              "repo": "https://github.com/openg2p/openg2p-fastapi-common",
              "ref": "develop"}
           ]}
        ]

      chart-path: deployment/charts/openg2p-spar

      # Every OpenG2P image tag the chart deploys. Third-party images
      # (jbergknoff/postgresql-client for the seed Job) stay pinned in values.yaml.
      chart-image-paths: |
        [".sparMapperAPI.image.tag",
         ".benePortalAPI.image.tag"]

      packaging-ref: v1

    secrets:
      docker_hub_actor: ${{ secrets.docker_hub_actor }}
      docker_hub_token: ${{ secrets.docker_hub_token }}
      OPENG2P_BOT_GITHUB_PAT: ${{ secrets.OPENG2P_BOT_GITHUB_PAT }}
      # Org-level secret; if unset the changelog still publishes human notes.
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
